<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAKERS 일정 투표</title>
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #2c2c2a;
  background: #fafaf8;
  margin: 0;
  padding: 0;
}

.container {
  width: 100%;
  padding: 2rem 1rem;
}

.header {
  margin-bottom: 2rem;
  text-align: center;
}

.header h1 {
  font-size: 28px;
  font-weight: 500;
  margin: 0 0 0.5rem;
  color: #2c2c2a;
  letter-spacing: -0.5px;
}

.header p {
  font-size: 14px;
  color: #888;
  margin: 0;
}

.main-content {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 1.5rem;
}

@media (max-width: 1200px) {
  .main-content {
    grid-template-columns: 1fr;
  }
}

.left-panel {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
}

.stat-card {
  background: #fff;
  border: 1px solid #e0dfd8;
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  transition: all 0.2s ease;
  cursor: default;
}

.stat-card:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.stat-label {
  font-size: 12px;
  color: #888;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.stat-date {
  font-size: 11px;
  color: #888;
  margin-bottom: 8px;
}

.stat-value {
  font-size: 24px;
  font-weight: 500;
  color: #2c2c2a;
  margin-bottom: 8px;
}

.stat-detail {
  font-size: 11px;
  color: #888;
}

.schedule-type {
  font-size: 10px;
  font-weight: 600;
  display: inline-block;
  padding: 3px 7px;
  border-radius: 4px;
  margin-bottom: 3px;
}

.schedule-type.training {
  background: #dbeafe;
  color: #1e40af;
}

.schedule-type.match {
  background: #fee2e2;
  color: #991b1b;
}

.table-wrapper {
  overflow-x: auto;
  border: 1px solid #e0dfd8;
  border-radius: 10px;
  background: #fff;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: #fafaf8;
  padding: 14px 10px;
  text-align: center;
  font-weight: 500;
  border-bottom: 1px solid #e0dfd8;
  color: #2c2c2a;
  font-size: 11px;
}

th:first-child {
  text-align: left;
  min-width: 100px;
}

td {
  padding: 12px 10px;
  border-bottom: 1px solid #f0ede6;
}

tr:last-child td {
  border-bottom: none;
}

tr:hover {
  background: #fafaf8;
}

.player-name {
  font-weight: 500;
  min-width: 100px;
  color: #2c2c2a;
  text-align: left;
}

.schedule-header {
  max-width: 90px;
  word-wrap: break-word;
}

.schedule-date {
  font-size: 10px;
  color: #888;
  display: block;
}

.vote-cell {
  text-align: center;
}

.vote-btn {
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: 11px;
  border: 1px solid #e0dfd8;
  background: #fff;
  color: #888;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.15s ease;
  font-weight: 600;
}

.vote-btn:hover:not(.yes):not(.no):not(.maybe) {
  border-color: #d0cfc8;
  background: #f5f5f0;
}

.vote-btn.yes {
  background: #dcfce7;
  color: #166534;
  border-color: #86efac;
}

.vote-btn.yes:hover {
  background: #bbf7d0;
  border-color: #4ade80;
}

.vote-btn.no {
  background: #fee2e2;
  color: #991b1b;
  border-color: #fca5a5;
}

.vote-btn.no:hover {
  background: #fecaca;
  border-color: #f87171;
}

.vote-btn.maybe {
  background: #fef3c7;
  color: #92400e;
  border-color: #fde047;
}

.vote-btn.maybe:hover {
  background: #fef08a;
  border-color: #facc15;
}

.total-col {
  font-weight: 600;
  color: #2c2c2a;
  text-align: center;
  min-width: 45px;
}

.right-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.chat-container {
  background: #fff;
  border: 1px solid #e0dfd8;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  height: 600px;
}

.chat-header {
  padding: 12px 14px;
  border-bottom: 1px solid #e0dfd8;
  font-weight: 500;
  font-size: 14px;
  color: #2c2c2a;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.message {
  background: #fafaf8;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.4;
}

.message-author {
  font-weight: 600;
  color: #2c2c2a;
  margin-bottom: 2px;
  font-size: 11px;
}

.message-text {
  color: #666;
  word-break: break-word;
}

.chat-input-area {
  padding: 10px;
  border-top: 1px solid #e0dfd8;
  display: flex;
  gap: 6px;
}

.chat-input-area input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #e0dfd8;
  border-radius: 4px;
  font-size: 12px;
  font-family: inherit;
}

.chat-input-area input:focus {
  outline: none;
  border-color: #d0cfc8;
  background: #fafaf8;
}

.chat-send-btn {
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid #e0dfd8;
  background: #fff;
  color: #2c2c2a;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.chat-send-btn:hover {
  background: #f5f5f0;
  border-color: #d0cfc8;
}

.summary {
  margin-top: 1rem;
  padding: 14px;
  background: #fff;
  border: 1px solid #e0dfd8;
  border-radius: 10px;
  font-size: 12px;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
  color: #2c2c2a;
}

.summary-row span:last-child {
  font-weight: 500;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>FAKERS 훈련 및 일정 투표</h1>
    <p>각 일정별 참석 여부를 투표해 주세요</p>
  </div>

  <div class="main-content">
    <div class="left-panel">
      <div class="stats" id="statsContainer"></div>

      <div class="table-wrapper">
        <table id="voteTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="summary" id="summary"></div>
    </div>

    <div class="right-panel">
      <div class="chat-container">
        <div class="chat-header">📢 공지사항</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="메시지..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button class="chat-send-btn" onclick="sendMessage()">보내기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const schedules = [
  { date: '2026.10.17', type: '[훈련]', location: '장기구장', category: 'training' },
  { date: '2026.10.31', type: '[훈련]', location: '장기구장', category: 'training' },
  { date: '2026.11.07', type: '[시합]', location: '노들리그', category: 'match' },
  { date: '2026.11.14', type: '[훈련]', location: '장기구장', category: 'training' },
  { date: '2026.11.21', type: '[훈련]', location: '장기구장', category: 'training' },
  { date: '2026.12.05', type: '[송년회]', location: '', category: 'match' },
  { date: '2027.01.09', type: '[훈련]', location: '고양실내연습장', category: 'training' },
  { date: '2027.01.23', type: '[훈련]', location: '고양실내연습장', category: 'training' },
  { date: '2027.02.13', type: '[훈련]', location: '고양실내연습장', category: 'training' },
  { date: '2027.02.20', type: '[훈련]', location: '고양실내연습장', category: 'training' }
];

const players = [
  '박준호', '박충규', '차인태', '박민호', '김병섭', '박세윤', '윤지열', '한동길', '박영욱', '이상헌',
  '장경환', '이원재', '고영일', '조민익', '박상우', '김송섭', '이정현', '유성일', '김구현', '김성주',
  '오영교', '김재명', '이상범', '박신영', '박지호', '이재민'
];

const storageKey = 'fakersVotes';
const chatStorageKey = 'fakersChatMessages';

function getVotes() {
  const stored = localStorage.getItem(storageKey);
  if (stored) return JSON.parse(stored);
  
  const votes = {};
  players.forEach(p => {
    votes[p] = {};
    schedules.forEach((_, i) => {
      votes[p][i] = null;
    });
  });
  return votes;
}

function getChatMessages() {
  const stored = localStorage.getItem(chatStorageKey);
  return stored ? JSON.parse(stored) : [];
}

function saveVotes(votes) {
  localStorage.setItem(storageKey, JSON.stringify(votes));
  render();
}

function saveChatMessages(messages) {
  localStorage.setItem(chatStorageKey, JSON.stringify(messages));
  renderChat();
}

function vote(playerName, scheduleIndex, value) {
  const votes = getVotes();
  const newValue = votes[playerName][scheduleIndex] === value ? null : value;
  votes[playerName][scheduleIndex] = newValue;
  saveVotes(votes);
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  
  if (!text) return;
  
  const messages = getChatMessages();
  const timestamp = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  
  messages.push({
    author: '감독',
    text: text,
    time: timestamp
  });
  
  saveChatMessages(messages);
  input.value = '';
  
  const chatMessages = document.getElementById('chatMessages');
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function renderChat() {
  const chatMessages = document.getElementById('chatMessages');
  const messages = getChatMessages();
  
  chatMessages.innerHTML = '';
  messages.forEach(msg => {
    const messageEl = document.createElement('div');
    messageEl.className = 'message';
    messageEl.innerHTML = `
      <div class="message-author">${msg.author} <span style="color: #aaa; font-size: 10px;">${msg.time}</span></div>
      <div class="message-text">${msg.text}</div>
    `;
    chatMessages.appendChild(messageEl);
  });
  
  setTimeout(() => {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }, 0);
}

function render() {
  const votes = getVotes();
  renderHeader();
  renderBody(votes);
  renderStats(votes);
  renderSummary(votes);
}

function renderHeader() {
  const headRow = document.getElementById('tableHead');
  headRow.innerHTML = '';
  
  let html = '<tr><th>선수명</th>';
  schedules.forEach((s, i) => {
    html += `<th class="vote-cell schedule-header">
      <div class="schedule-type ${s.category}">${s.type}</div>
      <div class="schedule-date">${s.date}</div>
    </th>`;
  });
  html += '<th class="total-col">합계</th></tr>';
  
  headRow.innerHTML = html;
}

function renderBody(votes) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  
  players.forEach(player => {
    const playerVotes = votes[player];
    let yesCount = 0;
    
    let row = `<tr><td class="player-name">${player}</td>`;
    
    schedules.forEach((_, i) => {
      const vote = playerVotes[i];
      if (vote === 'yes') yesCount++;
      
      const btnClass = vote ? vote : '';
      
      row += `<td class="vote-cell">
        <button class="vote-btn ${btnClass}" onclick="vote('${player}', ${i}, 'yes')" title="참석">O</button>
        <button class="vote-btn ${btnClass}" onclick="vote('${player}', ${i}, 'no')" title="불참">X</button>
        <button class="vote-btn ${btnClass}" onclick="vote('${player}', ${i}, 'maybe')" title="미정">?</button>
      </td>`;
    });
    
    row += `<td class="total-col">${yesCount}</td></tr>`;
    tbody.innerHTML += row;
  });
}

function renderStats(votes) {
  const statsContainer = document.getElementById('statsContainer');
  statsContainer.innerHTML = '';
  
  const stats = schedules.map((s, i) => {
    let yes = 0, no = 0, maybe = 0;
    players.forEach(p => {
      const vote = votes[p][i];
      if (vote === 'yes') yes++;
      else if (vote === 'no') no++;
      else if (vote === 'maybe') maybe++;
    });
    
    return {
      date: s.date,
      type: s.type,
      yes, no, maybe,
      category: s.category
    };
  });
  
  stats.forEach(stat => {
    const typeClass = stat.category === 'match' ? 'match' : 'training';
    
    const html = `
      <div class="stat-card">
        <div class="stat-label">
          <span class="schedule-type ${typeClass}" style="margin-right: 0;">${stat.type}</span>
        </div>
        <div class="stat-date">${stat.date}</div>
        <div class="stat-value">${stat.yes}</div>
      </div>
    `;
    statsContainer.innerHTML += html;
  });
}

function renderSummary(votes) {
  const summary = document.getElementById('summary');
  
  let totalYes = 0, totalNo = 0, totalMaybe = 0;
  
  players.forEach(p => {
    schedules.forEach((_, i) => {
      const vote = votes[p][i];
      if (vote === 'yes') totalYes++;
      else if (vote === 'no') totalNo++;
      else if (vote === 'maybe') totalMaybe++;
    });
  });
  
  const totalResponses = totalYes + totalNo + totalMaybe;
  const total = schedules.length * players.length;
  const responseRate = total > 0 ? Math.round((totalResponses / total) * 100) : 0;
  const avgAttendance = schedules.length > 0 ? (totalYes / schedules.length).toFixed(1) : 0;
  
  summary.innerHTML = `
    <div class="summary-row">
      <span>응답률</span>
      <span>${responseRate}%</span>
    </div>
    <div class="summary-row">
      <span>참석/불참/미정</span>
      <span>${totalYes}/${totalNo}/${totalMaybe}</span>
    </div>
    <div class="summary-row">
      <span>평균 참석</span>
      <span>${avgAttendance}명</span>
    </div>
  `;
}

render();
renderChat();
</script>

</body>
</html>
